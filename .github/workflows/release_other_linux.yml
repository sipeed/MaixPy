name: Build Linux wheel
'on':
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      ci_sha:
        required: true
        type: string
      sdk_sha:
        required: true
        type: string
      python_version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SDK_SHA: ${{ inputs.sdk_sha }}
      CI_SHA: ${{ inputs.ci_sha }}
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - name: Checkout CI tooling
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ci_sha }}
        path: _ci
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}
    - name: Set up build environment
      uses: ./_ci/.github/actions/setup-build
      with:
        sdk_sha: ${{ inputs.sdk_sha }}
    - name: Build and smoke-test Linux wheel
      run: |-
        python setup.py bdist_wheel linux
        bash run.sh test/test_basic.py
        mkdir -p out
        cp dist/*.whl out/
        for wheel in out/*.whl; do python _ci/.github/scripts/release_tools.py verify-wheel "$wheel" --machine 62; done
        python _ci/.github/scripts/release_tools.py manifest out "linux-$PYTHON_VERSION"
      env:
        PYTHON_VERSION: ${{ inputs.python_version }}
    - name: Store build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-linux-${{ inputs.python_version }}
        path: out/*
        if-no-files-found: error
        retention-days: 14
        overwrite: true
