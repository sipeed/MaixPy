name: Build MaixCAM wheel and images
'on':
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      ci_sha:
        required: true
        type: string
      sdk_sha:
        required: true
        type: string
      images:
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SDK_SHA: ${{ inputs.sdk_sha }}
      CI_SHA: ${{ inputs.ci_sha }}
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - name: Checkout CI tooling
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ci_sha }}
        path: _ci
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Set up build environment
      uses: ./_ci/.github/actions/setup-build
      with:
        sdk_sha: ${{ inputs.sdk_sha }}
    - name: Build native bindings and cross-compile MaixCAM wheel
      run: |-
        python setup.py bdist_wheel linux
        bash run.sh test/test_basic.py
        python setup.py bdist_wheel maixcam
        mkdir -p out
        cp dist/*.whl out/
        for wheel in out/*.whl; do python _ci/.github/scripts/release_tools.py verify-wheel "$wheel" --machine 243; done
    - name: Download and verify pinned image inputs
      run: |-
        python _ci/.github/scripts/release_tools.py download _ci/.github/release-config.json build/release-inputs
        mkdir -p build/release-inputs/builtin
        tar -xJf build/release-inputs/maixcam_builtin_files.tar.xz -C build/release-inputs/builtin
        cp build/release-inputs/maixcam_builtin_files.tar.xz build/release-inputs/release-inputs.json out/
      if: ${{ inputs.images }}
    - name: Package MaixCAM and MaixCAM Pro using native scripts
      run: |-
        root="$PWD"
        wheel=$(find "$root/out" -maxdepth 1 -name "*.whl" -print)
        test "$(find "$root/out" -maxdepth 1 -name "*.whl" | wc -l)" -eq 1
        base="$root/build/release-inputs/base_os.img.xz"
        builtin="$root/build/release-inputs/builtin/maixcam_builtin_files"
        cd tools/os/maixcam
        bash gen_os.sh "$base" "$wheel" "$builtin" 0 maixcam
        bash gen_os.sh "$base" "$wheel" "$builtin" 1 maixcam-pro
        for board in maixcam maixcam-pro; do
          for image in images/"$board"-????-??-??-maixpy-v*.img.xz; do
            xz --test "$image"
            (cd "$root" && python _ci/.github/scripts/release_tools.py check-image "tools/os/maixcam/$image" --board "$board")
          done
        done
        cp images/*.img.xz "$root/out/"
      if: ${{ inputs.images }}
    - name: Record build provenance
      run: python _ci/.github/scripts/release_tools.py manifest out maixcam
    - name: Store build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-maixcam
        path: out/*
        if-no-files-found: error
        retention-days: 14
        overwrite: true
